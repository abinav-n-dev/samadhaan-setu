  <circle cx='400' cy='210' r='110' fill='rgba(255,255,255,0.06)' />
  <circle cx='400' cy='210' r='80' fill='rgba(255,255,255,0.1)' />
  
  <!-- Central Icon Emblem -->
  <g transform='translate(350, 160)' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <path d="M50 5 C50 5 15 50 15 70 A 35 35 0 0 0 85 70 C 85 50 50 5 50 5 Z" fill="rgba(110,231,183,0.3)" stroke="#6EE7B7" /><path d="M35 70 L45 80 L65 60" stroke="#6EE7B7" stroke-width="5" />
  </g>
  
  <!-- Pill Badge -->
