<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' width='800' height='500'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F766E' />
      <stop offset='100%' stop-color='#042F2E' />
    </linearGradient>
    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='rgba(255,255,255,0.08)' stroke-width='1'/>
    </pattern>
  </defs>
  <rect width='100%' height='100%' fill='url(#bg)' />
  <rect width='100%' height='100%' fill='url(#grid)' />
  
  <circle cx='400' cy='210' r='110' fill='rgba(255,255,255,0.06)' />
  <circle cx='400' cy='210' r='80' fill='rgba(255,255,255,0.1)' />
  
  <!-- Central Icon Emblem -->
  <g transform='translate(350, 160)' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'>
    <path d="M50 0 C50 0 10 50 10 70 A 40 40 0 0 0 90 70 C 90 50 50 0 50 0 Z" fill="rgba(255,255,255,0.2)" />
  </g>
  
  <!-- Pill Badge -->
  <rect x='300' y='60' width='200' height='32' rx='16' fill='rgba(0,0,0,0.3)' stroke='rgba(255,255,255,0.2)' stroke-width='1'/>
  <text x='400' y='81' text-anchor='middle' fill='#A7F3D0' font-family='system-ui, sans-serif' font-size='12' font-weight='700' letter-spacing='2'>WATER & HEALTH</text>

  <!-- Titles -->
  <text x='400' y='365' text-anchor='middle' fill='#FFFFFF' font-family='system-ui, sans-serif' font-size='24' font-weight='800'>Deep Aquifer Remediation Rig</text>
  <text x='400' y='400' text-anchor='middle' fill='rgba(255,255,255,0.75)' font-family='system-ui, sans-serif' font-size='14' font-weight='500'>Arsenic and Heavy Metal Absorption Unit</text>

  <!-- Gov / Verified Footer -->
  <rect x='40' y='450' width='720' height='1' fill='rgba(255,255,255,0.15)' />
  <text x='50' y='475' fill='rgba(255,255,255,0.5)' font-family='monospace' font-size='11'>SAMADHAN SETU • OFFICIAL EVIDENCE PROTOCOL</text>
  <text x='750' y='475' text-anchor='end' fill='#6EE7B7' font-family='monospace' font-size='11'>LOCATION-VERIFIED &amp; COMPRESSED</text>
</svg>